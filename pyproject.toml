[project]
name = "centralasiaciv"
version = "0.1.0"
description = "Central Asia (Uzbekistan, Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan) as a 4X strategy-game map, built from public data"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
build = ["numpy>=2.0", "pillow>=11.0", "pyproj>=3.7", "shapely>=2.0"]
harness = ["pillow>=11.0", "playwright>=1.50"]

[tool.uv]
package = false
