<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="lapis" cx="42%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#226898"/>
      <stop offset="55%" stop-color="#143a62"/>
      <stop offset="100%" stop-color="#0b1d33"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e29c"/>
      <stop offset="48%" stop-color="#d4a64a"/>
      <stop offset="100%" stop-color="#966c24"/>
    </linearGradient>
    <linearGradient id="turq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58e0d0"/>
      <stop offset="100%" stop-color="#198a96"/>
    </linearGradient>
  </defs>
  <!-- Outer dark bronze hex frame (pointy-top 4X tile) -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="#0e141c" stroke="url(#gold)" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Inner lapis lazuli hex field -->
  <polygon points="32,6.2 54.4,19.1 54.4,44.9 32,57.8 9.6,44.9 9.6,19.1" fill="url(#lapis)" stroke="#3e8db5" stroke-width="0.9" stroke-opacity="0.55"/>
  <!-- Silk Road Timurid 8-pointed Rub el Hizb star -->
  <g transform="translate(32,32)">
    <rect x="-12.5" y="-12.5" width="25" height="25" rx="1.2" fill="url(#turq)" fill-opacity="0.92" stroke="url(#gold)" stroke-width="1.8"/>
    <rect x="-12.5" y="-12.5" width="25" height="25" rx="1.2" transform="rotate(45)" fill="url(#turq)" fill-opacity="0.92" stroke="url(#gold)" stroke-width="1.8"/>
    <!-- Inner golden octagon rosette -->
    <polygon points="0,-10.5 7.4,-7.4 10.5,0 7.4,7.4 0,10.5 -7.4,7.4 -10.5,0 -7.4,-7.4" fill="#123052" stroke="url(#gold)" stroke-width="1.4"/>
    <!-- Center star jewel -->
    <polygon points="0,-6.5 1.8,-1.8 6.5,0 1.8,1.8 0,6.5 -1.8,1.8 -6.5,0 -1.8,-1.8" fill="#f9e9b0"/>
    <circle cx="0" cy="0" r="1.7" fill="#46d8c9"/>
  </g>
</svg>
