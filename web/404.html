<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found</title>
  <meta name="robots" content="noindex">
  <!-- Served by the host for any address that has no file, with status 404, so a missing data file fails visibly
       instead of returning this site's front page. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #131e2a; color: #e8e2d0;
           font: 16px/1.5 Georgia, "Times New Roman", serif; padding: 0 16px; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 1.6rem; letter-spacing: 0.04em; margin: 0 0 0.5rem; }
    a { color: #e6c27a; }
  </style>
</head>
<body>
  <main>
    <h1>Uncharted territory</h1>
    <p>There is nothing at this address. <a href="/">Back to the map</a>.</p>
  </main>
</body>
</html>
